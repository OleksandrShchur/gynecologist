name: Shared build and test

on:
  workflow_call:
    inputs:
      base-path:
        description: Base path of the production build to validate
        required: true
        type: string
    outputs:
      artifact-name:
        description: Production files uploaded after all checks pass
        value: ${{ jobs.build-test.outputs.artifact-name }}

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_BASE_PATH: ${{ inputs.base-path }}
    outputs:
      artifact-name: ${{ steps.artifact.outputs.artifact-name }}
    steps:
      - name: Check out selected commit
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Identify build artifact
        id: artifact
        run: node .github/scripts/validated-build.mjs name

      - name: Install dependencies
        run: npm ci

      - name: Install test browser
        run: npx playwright install --with-deps chromium

      # npm test builds once, then tests the same dist/ that is uploaded below.
      - name: Build and test production site
        run: npm test

      - name: Upload validated production files
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.artifact-name }}
          path: dist/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ steps.artifact.outputs.artifact-name }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
